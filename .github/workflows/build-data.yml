name: Build HydroGeoAI data

on:
  push:
    branches: ["main"]
    paths:
      - "About/**"
      - "News/**"
      - "Projects/**"
      - "Services/**"
      - "Team/**"
      - "Collaborations/**"
      - "Equipment/**"
      - "Technologies/**"
      - "Resources/**"
      - "Publications/**"
      - "Contact/**"
      - "scripts/build_data.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate JSON
        run: python scripts/build_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-update HydroGeoAI data"
            git push
          fi
